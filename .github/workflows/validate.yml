name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Schema is up to date with dimensions.json
        run: python scripts/build_schema.py --check
      - name: Validate data
        run: python scripts/validate.py
      - name: Tests
        run: pytest -q
