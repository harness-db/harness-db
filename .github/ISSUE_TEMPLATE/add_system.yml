name: Add or update a system
description: Claim a system you will code yourself, so that two people do not code the same one.
title: "[add] <system name>"
labels: ["add-system"]
body:
  - type: markdown
    attributes:
      value: |
        The full workflow is under "Add or update a system" in `CONTRIBUTING.md`. In short:

        1. Copy `contrib/TEMPLATE_system.json` to `contrib/<id>.json`.
        2. Fill all 38 cells, each with a quote and a locator, or with `not_reported`.
        3. Run `python scripts/validate.py --system contrib/<id>.json`.
        4. Open a pull request that links this issue.

        `docs/COVERAGE_WANTED.md` lists the systems where a new coding counts most.
  - type: dropdown
    id: kind
    attributes:
      label: New system or update?
      options:
        - New system (not in data/systems.json)
        - Update to a system already in data/systems.json
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: System name
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: Proposed id
      description: A lowercase slug using a-z, 0-9 and hyphens. For an update, the existing id.
      placeholder: my-agent
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository URL
  - type: input
    id: paper
    attributes:
      label: Paper (arXiv id, DOI or URL)
  - type: input
    id: pin
    attributes:
      label: Version you will code
      description: "Tag and full commit hash, as `<tag> @ <commit> (<YYYY-MM-DD>)`. For a system with only a paper, write `paper only`."
      placeholder: "v1.1.0 @ 0f3acafacabc0def8cc76b4e48acb4b6cf302cb9 (2025-05-22)"
    validations:
      required: true
  - type: textarea
    id: cells
    attributes:
      label: For an update, the cells that change
      description: One line per cell, giving the dimension, the old value, the new value and the reason.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I have read CONTRIBUTING.md and the general rules at the top of docs/coding_manual.md.
          required: true
        - label: Every value I code will have a verbatim quote and a locator, either at the pinned commit or a paper section.
          required: true
        - label: I agree that my contribution is released under CC BY 4.0 (data) and MIT (code).
          required: true
