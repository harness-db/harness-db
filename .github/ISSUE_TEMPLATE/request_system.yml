name: Request a system
description: Ask for a harness that is not in HARNESS-DB to be coded.
title: "[request] <system name>"
labels: ["request-system"]
body:
  - type: markdown
    attributes:
      value: |
        HARNESS-DB codes agent harnesses: the software between a language model and a task
        environment that assembles the model's input, executes its actions and decides whether to
        continue (`docs/definition.md`). If you would rather code the system yourself, open an
        "Add or update a system" issue instead.
  - type: input
    id: name
    attributes:
      label: System name
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository URL
      placeholder: https://github.com/org/agent
  - type: input
    id: paper
    attributes:
      label: Paper (arXiv id, DOI or URL)
  - type: input
    id: docs
    attributes:
      label: Documentation URL
  - type: checkboxes
    id: definition
    attributes:
      label: Is it a harness?
      description: Tick what the system itself does, not what the model or a library under it does.
      options:
        - label: It assembles the model's input on each step (prompt, context, observations).
        - label: It executes the actions the model chooses (tools, code, clicks, API calls).
        - label: It decides whether to continue, stop or hand off (a loop with a termination rule).
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: For example, how widely it is used, a design choice it adds, or a benchmark result it is known for.
