name: Report a wrong cell
description: A coded value is wrong, or you can settle a not_reported cell with evidence.
title: "[wrong cell] <system_id> / <dimension>"
labels: ["wrong-cell"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A maintainer re-opens your locator and either corrects the cell in the next release
        or replies with the reason it stands. You can see any cell in `data/systems.json`, or with
        `hdb.load().evidence("<system_id>", "<dimension>")`.
  - type: input
    id: system
    attributes:
      label: System id
      description: The `id` in data/systems.json, for example `mini-swe-agent`.
    validations:
      required: true
  - type: dropdown
    id: dimension
    attributes:
      label: Dimension
      options:
        - "A1 system_prompt_style"
        - "A2 env_context_strategy"
        - "A3 context_compaction"
        - "A4 observation_format"
        - "B1 tool_call_format"
        - "B2 tool_count"
        - "B3 edit_primitive"
        - "B4 tool_schema_source"
        - "B5 protocol_standardization"
        - "C1 loop_primitives"
        - "C2 planning_granularity"
        - "C3 multi_agent_topology"
        - "C4 delegation_mechanism"
        - "C5 human_in_loop"
        - "D1 short_term_state"
        - "D2 long_term_memory"
        - "D3 state_persistence"
        - "E1 self_verification"
        - "E2 retry_policy"
        - "E3 rollback"
        - "F1 termination_condition"
        - "F2 cost_controls"
        - "F3 timeouts"
        - "G1 execution_isolation"
        - "G2 filesystem_access"
        - "G3 network_policy"
        - "G4 permission_model"
        - "H1 tracing"
        - "H2 replayability"
        - "H3 eval_hooks"
        - "H4 guardrails"
        - "M1 target_domain"
        - "M2 open_source"
        - "M3 model_agnostic"
        - "M4 primary_artifact"
        - "M5 first_release_date"
        - "M6 pinned_version"
        - "M7 stars"
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Value in the dataset now
      description: As released, for example `subprocess`, `react|multi_attempt`, or `not_reported`.
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: Value you think is right
      description: A value allowed by schema/dimensions.json (several, pipe-joined, for a multi-valued dimension), or `not_reported`.
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: Verbatim quote
      description: Copied exactly from the source. No paraphrase.
      render: text
    validations:
      required: true
  - type: input
    id: locator
    attributes:
      label: Locator
      description: "`path/to/file.py:LINE@<commit>` for code, or `arXiv:<id> Sec. N` for a paper."
      placeholder: "src/sandbox/config.py:66@f14a9c065ca8"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: For example, the pinned version is outdated, or the shipped default differs from a configurable option (coding manual rule 4).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The quote is copied verbatim, and the locator points at a fixed commit or a paper section.
          required: true
        - label: If I propose `none` or another absence value, the locator is the place where the feature would be declared, not a passage that does not mention it (coding manual rule 5).
