[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-db"
version = "0.1.0"
description = "HARNESS-DB: coded, evidence-backed dataset of LLM agent harnesses (2022-2026) and the tooling behind the HARNESS-Review systematic review"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com"}]
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "requests>=2.32",
  "rapidfuzz>=3.9",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
