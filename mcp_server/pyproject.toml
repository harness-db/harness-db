[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessdb-mcp"
version = "0.1.0"
description = "MCP server for HARNESS-DB: query 1,256 coded LLM agent harnesses, their evidence and their silences from any MCP client"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "llm-agents", "agent-harness", "dataset"]
# The query layer (harnessdb_mcp.tools) is stdlib-only; the SDK is the one runtime dependency
# (pydantic comes with it). Tested on mcp 2.2 (MCPServer); falls back to the 1.x FastMCP class.
dependencies = ["mcp>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
harnessdb-mcp = "harnessdb_mcp.server:main"

[tool.setuptools]
packages = ["harnessdb_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
